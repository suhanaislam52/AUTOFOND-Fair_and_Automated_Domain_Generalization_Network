method: grid
metric:
  goal: maximize
  name: val/oacc
parameters:
  algo:
    value: FOND  # REGULAR FOND, not distillation!
  checkpoint_freq:
    value: 300
  data_dir:
    value: ./data
  dataset:  # ← Fixed: Now has 2 spaces like the others
    values:
      - VLCS
      - PACS
  holdout_fraction:
    value: 0.2
  hparam_id:
    values:  # ← Also fixed this spacing
      - 0
      - 1
      - 2
      - 3
      - 4
  log_dir:
    value: ./logs
  model_checkpoint:
    value:
      maximize: true
      metric: val/oacc
  n_steps:
    value: 5001
  num_classes:
    value: null  # ← Changed 'Null' to 'null' (lowercase)
  num_domain_linked_classes:
    value: null  # ← Changed 'Null' to 'null' (lowercase)
  num_workers:
    value: 4
  overall_seed:
    value: 1
  overlap:
    values:
      - high
  teacher_paths:
    value: {}  # Empty for regular FOND
  test_set_id:
    values:
      - 0
      - 1
      - 2
      - 3
  trial_id:
    values:
      - 0
      - 1
      - 2
